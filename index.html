function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      resolve();
    } catch (e) {
      reject(e);
    }
  });
}

const PROGRESS_KEY = "breath_app_progress_v1";
function loadProgressLog() {
  try {
    return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || [];
  } catch (e) {
    return [];
  }
}
function logSessionCompletion(techniqueId, durationSeconds) {
  try {
    const log = loadProgressLog();
    log.push({ techniqueId, durationSeconds, at: new Date().toISOString() });
    if (log.length > 1000) log.splice(0, log.length - 1000);
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(log));
  } catch (e) {}
}
function computeProgressStats() {
  const log = loadProgressLog();
  const totalSeconds = log.reduce((s, e) => s + (e.durationSeconds || 0), 0);
  const totalMinutes = Math.round(totalSeconds / 60);
  const sessionsCount = log.length;
  const counts = {};
  log.forEach((e) => {
    counts[e.techniqueId] = (counts[e.techniqueId] || 0) + 1;
  });
  let favoriteId = null;
  let max = 0;
  Object.entries(counts).forEach(([id, c]) => {
    if (c > max) {
      max = c;
      favoriteId = id;
    }
  });
  return { totalMinutes, sessionsCount, favoriteId };
}
function countTechniqueCompletions(techniqueId) {
  return loadProgressLog().filter((e) => e.techniqueId === techniqueId).length;
}

function makeStars(seed, count) {
  let s = seed;
  const rand = () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
  return Array.from({ length: count }).map(() => ({
    x: rand() * 100,
    y: rand() * 100,
    size: rand() * 1.3 + 0.5,
    opacity: rand() * 0.55 + 0.25,
    twinkle: rand() * 3 + 2,
  }));
}
function Starfield({ seed, count = 40 }) {
  const stars = useMemo(() => makeStars(seed, count), [seed, count]);
  return (
    <div style={{ position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none" }}>
      {stars.map((s, i) => (
        <div
          key={i}
          style={{
            position: "absolute",
            left: `${s.x}%`,
            top: `${s.y}%`,
            width: s.size,
            height: s.size,
            borderRadius: "50%",
            background: "#F2F7FB",
            opacity: s.opacity,
            animation: `twinkle ${s.twinkle}s ease-in-out infinite`,
            animationDelay: `${(i % 7) * 0.4}s`,
          }}
        />
      ))}
    </div>
  );
}

// =====================================================================
function useReminderSettings() {
  const [settings, setSettings] = useState({
    remindersEnabled: false,
    frequency: "daily",
    dailyTime: "12:00",
    workEnabled: false,
    personalEnabled: true,
    autoplaySound: false,
    autoplayVibration: false,
    timezone: "Europe/Moscow", // дефолтное значение
  });
  const [saveState, setSaveState] = useState(null);

  useEffect(() => {
    if (!TG_INIT_DATA) return;
    fetch(`${API_BASE}/api/settings?initData=${encodeURIComponent(TG_INIT_DATA)}`)
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (!data) return;
        setSettings((prev) => ({
          ...prev,
          remindersEnabled: !!data.remindersEnabled,
          frequency: data.frequency || prev.frequency,
          dailyTime: data.dailyTime || prev.dailyTime,
          workEnabled: !!data.workEnabled,
          personalEnabled: data.personalEnabled !== undefined ? !!data.personalEnabled : prev.personalEnabled,
          autoplaySound: !!data.autoplaySound,
          autoplayVibration: !!data.autoplayVibration,
          timezone: data.timezone || prev.timezone, //
        }));
         try {
          localStorage.setItem("breath_app_autoplay", JSON.stringify({
            autoplaySound: !!data.autoplaySound,
            autoplayVibration: !!data.autoplayVibration,
          }));
        } catch (e) {}
      })
      .catch(() => {});
  }, []);

    // Автоматически определяем и сохраняем часовой пояс устройства
  useEffect(() => {
    const deviceTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    
    // Проверяем, что пояс определился и он не совпадает с тем, что уже сохранен
    // settings.timezone берется из начального состояния или из данных сервера
    if (deviceTimezone && settings.timezone !== deviceTimezone) {
      save({ timezone: deviceTimezone });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []); // Пустой массив означает: выполнить 1 раз при монтировании компонента

  const save = (patch) => {
    setSettings((prev) => ({ ...prev, ...patch }));
     try {
      localStorage.setItem("breath_app_autoplay", JSON.stringify({
        autoplaySound: patch.autoplaySound !== undefined ? patch.autoplaySound : settings.autoplaySound,
        autoplayVibration: patch.autoplayVibration !== undefined ? patch.autoplayVibration : settings.autoplayVibration,
      }));
    } catch (e) {}
    if (!TG_INIT_DATA) return;
    setSaveState("saving");
    fetch(`${API_BASE}/api/settings`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: TG_INIT_DATA, ...patch }),
    })
      .then((r) => {
        if (!r.ok) throw new Error("bad response");
        setSaveState("saved");
        setTimeout(() => setSaveState(null), 1800);
      })
      .catch(() => {
        setSaveState("error");
        setTimeout(() => setSaveState(null), 2500);
      });
  };

  return { settings, save, saveState };
}

// =====================================================================
// Экран дыхательной сессии
// =====================================================================
function getPhaseState(phases, elapsedInCycle) {
  let acc = 0;
  for (let i = 0; i < phases.length; i++) {
    const p = phases[i];
    if (elapsedInCycle < acc + p.seconds) {
      const phaseElapsed = elapsedInCycle - acc;
      const progress = clamp(phaseElapsed / p.seconds, 0, 1);
      return { phase: p, progress };
    }
    acc += p.seconds;
  }
  const last = phases[phases.length - 1];
  return { phase: last, progress: 1 };
}

function BreathingSession({ technique, onExit }) {
  const { phases, sessionSeconds, guided } = technique;
  const cycleSeconds = phases.reduce((s, p) => s + p.seconds, 0);

  const [elapsed, setElapsed] = useState(0);
  const [completed, setCompleted] = useState(false);
  const [showChrome, setShowChrome] = useState(true);
  const [showInfo, setShowInfo] = useState(false);
  const [soundOn, setSoundOn] = useState(false);
  const [vibrationOn, setVibrationOn] = useState(false);
  const [preparing, setPreparing] = useState(true);

  const metronomeEnabled = !!technique.metronome;
  const metroAudioRef = useRef(null);
  const [metroOn, setMetroOn] = useState(false);
  const [beat, setBeat] = useState(0);
  const beatTimerRef = useRef();

  const rafRef = useRef();
  const lastTsRef = useRef(null);
  const idleTimerRef = useRef();
  const soundOnRef = useRef(false);

  const audioCtxRef = useRef(null);
  const oscRef = useRef(null);
  const gainRef = useRef(null);

    const startAudio = () => {
    try {
      const file = technique.soundFile || "sound.mp3";
      const audio = new Audio(file);
      audio.loop = true;
      audio.volume = 0.5;
      const seekTo = () => {
        try {
          if (audio.duration && isFinite(audio.duration) && audio.duration > 0) {
            const t = elapsed % audio.duration; // elapsed — текущее время практики
            audio.currentTime = t;
          }
        } catch (e) {}
      };

    audio.addEventListener("loadedmetadata", seekTo);
    if (audio.readyState >= 1) seekTo();

    audio.play().catch(() => {});
    audioCtxRef.current = audio;
    } catch (e) {}
  };

  const stopAudio = () => {
    try {
      if (audioCtxRef.current && audioCtxRef.current.pause) {
        audioCtxRef.current.pause();
      }
    } catch (e) {}
    audioCtxRef.current = null;
  };

      const startMetronome = () => {
    const audio = new Audio("metronome.mp3");
    audio.volume = 0.8;
    metroAudioRef.current = audio;
    const play = () => { audio.currentTime = 0; audio.play().catch(() => {}); };
    play();
    beatTimerRef.current = setInterval(() => { play(); setBeat((b) => b + 1); }, 1000);
  };

  const stopMetronome = () => {
    clearInterval(beatTimerRef.current);
    beatTimerRef.current = null;
    try { metroAudioRef.current && metroAudioRef.current.pause(); } catch (e) {}
    metroAudioRef.current = null;
  };

    // Синхронизируем soundOnRef с актуальным значением soundOn,
  // чтобы useEffect подготовки видел его без пересоздания таймера
  useEffect(() => {
    soundOnRef.current = soundOn;
  }, [soundOn]);

  // Сброс состояния при смене практики
  useEffect(() => {
    if (!preparing) return;

    // Пока идёт подготовка — глушим любой звук, даже если пользователь
    // нажал 🔊 или включил автозапуск до входа в практику.
    stopAudio();
    stopMetronome();

    const t = setTimeout(() => {
      setPreparing(false);
      lastTsRef.current = null; // чтобы практика началась с 0, а не с задержкой

      // Читаем настройку автозапуска звука
      let autoplaySound = false;
      try {
        const raw = localStorage.getItem("breath_app_autoplay");
        if (raw) {
          const parsed = JSON.parse(raw);
          autoplaySound = !!parsed.autoplaySound;
        }
      } catch (e) {}

      // Если звук должен играть — включаем. Если пользователь нажал 🔊 во время
      // подготовки, soundOn уже будет true (см. пункт 3), поэтому тоже включаем.
      if (autoplaySound || soundOnRef.current) {
        if (technique.metronome) startMetronome();
        else startAudio();
        setSoundOn(true);
      }
    }, 3000);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [preparing]);

  useEffect(() => () => { stopAudio(); stopMetronome(); }, []);

  useEffect(() => {
    if (completed) {
      logSessionCompletion(technique.id, sessionSeconds);
      stopAudio();
      stopMetronome();
      setSoundOn(false);
      setMetroOn(false);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [completed]);

  // Плавное затухание звука за 5–6 секунд до конца практики
  useEffect(() => {
    if (!audioCtxRef.current) return;
    if (completed) return;

    const FADE_DURATION = 5;
    const BASE_VOLUME = 0.5;
    const remaining = sessionSeconds - elapsed;

    if (remaining <= FADE_DURATION) {
      const k = Math.max(0, remaining / FADE_DURATION);
      audioCtxRef.current.volume = BASE_VOLUME * k;
    } else {
      audioCtxRef.current.volume = BASE_VOLUME;
    }
  }, [elapsed, sessionSeconds, completed]);

  useEffect(() => () => { stopAudio(); stopMetronome(); }, []);

  useEffect(() => {
    if (completed) {
      logSessionCompletion(technique.id, sessionSeconds);
      stopAudio();
      stopMetronome();
      setSoundOn(false);
      setMetroOn(false);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [completed]);

    // Плавное затухание звука за 5–6 секунд до конца практики
  useEffect(() => {
    if (!audioCtxRef.current) return;
    if (completed) return;

    const FADE_DURATION = 5; // секунд
    const BASE_VOLUME = 0.5;

    const remaining = sessionSeconds - elapsed;

    if (remaining <= FADE_DURATION) {
      // линейно уменьшаем громкость от BASE_VOLUME до 0
      const k = Math.max(0, remaining / FADE_DURATION); // 1 → 0
      audioCtxRef.current.volume = BASE_VOLUME * k;
    } else {
      // за пределами зоны затухания держим базовую громкость
      audioCtxRef.current.volume = BASE_VOLUME;
    }
  }, [elapsed, sessionSeconds, completed]);

  const tick = useCallback(
    (ts) => {
        if (preparing) {
        lastTsRef.current = ts; // обновляем метку, но ничего не считаем
        rafRef.current = requestAnimationFrame(tick);
        return;
      }
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;

      setElapsed((prev) => {
        if (completed) return prev;
        const next = prev + dt;
        if (next >= sessionSeconds) {
          setCompleted(true);
          return sessionSeconds;
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(tick);
    },
    [completed, sessionSeconds, preparing]
  );

  useEffect(() => {
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [tick]);

  const wake = () => {
    setShowChrome(true);
    clearTimeout(idleTimerRef.current);
    idleTimerRef.current = setTimeout(() => setShowChrome(false), 3200);
  };
  useEffect(() => {
    wake();
    return () => clearTimeout(idleTimerRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const sessionT = clamp(elapsed / sessionSeconds, 0, 1);
  const elapsedInCycle = elapsed % cycleSeconds;
  const { phase, progress } = getPhaseState(phases, elapsedInCycle);

  const breathScale = completed
    ? 1.65 + Math.sin(elapsed * 0.4) * 0.05
    : metronomeEnabled
      ? lerp(phase.from, phase.to, easeInOutSine(progress))
      : lerp(phase.from, phase.to, easeInOutSine(progress));

  const breathMin = Math.min(...phases.map((p) => Math.min(p.from, p.to)));
  const breathMax = Math.max(...phases.map((p) => Math.max(p.from, p.to)));
  const breathNorm = clamp((breathScale - breathMin) / (breathMax - breathMin || 1), 0, 1);


  const prevPhaseRef = useRef(phase.name);
  useEffect(() => {
    if (prevPhaseRef.current !== phase.name) {
      prevPhaseRef.current = phase.name;
      if (guided && vibrationOn && typeof navigator !== "undefined" && navigator.vibrate && (phase.name === "Вдох" || phase.name === "Выдох")) {
        navigator.vibrate(90);
      }
    }
  }, [phase.name, vibrationOn, guided]);

  const remainingDisplay = Math.max(0, sessionSeconds - 1 - Math.floor(elapsed));
  const minutesLeft = Math.floor(remainingDisplay / 60);
  const secondsLeft = remainingDisplay % 60;
  const currentCycle = technique.displayMode === "cycles" ? Math.min(technique.totalCycles, Math.floor(elapsed / cycleSeconds) + 1) : null;

  const R = 118;
  const C = 2 * Math.PI * R;
  const dash = C * (1 - sessionT);

  const iconBtnStyle = (active) => ({
    width: 38,
    height: 38,
    borderRadius: "50%",
    border: "none",
    background: active ? "rgba(255,255,255,0.20)" : "rgba(255,255,255,0.08)",
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
    color: active ? "#F5FBFF" : "rgba(234,242,248,0.55)",
    transition: "background 0.4s ease, color 0.4s ease",
    backdropFilter: "blur(6px)",
    cursor: "pointer",
  });

  return (
    <div
      onPointerMove={wake}
      onClick={() => {
        wake();
        setShowInfo(false);
      }}
      style={{
        width: "100%",
        height: "100vh",
        minHeight: 640,
        background: BG,
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        justifyContent: "center",
        position: "relative",
        overflow: "hidden",
        fontFamily: FONT,
        userSelect: "none",
      }}
    >
      <Starfield seed={technique.id.length * 251 + technique.sessionSeconds} count={110} />
      <div style={{ position: "absolute", inset: 0, background: "radial-gradient(circle at 50% 42%, transparent 0%, rgba(0,0,0,0.22) 100%)", pointerEvents: "none" }} />

      <div style={{ position: "absolute", top: 22, left: 22, right: 22, display: "flex", justifyContent: "space-between", alignItems: "center", opacity: showChrome ? 1 : 0, transition: "opacity 0.9s ease" }}>
        <button
          aria-label="Назад к практикам"
          onClick={(e) => {
            e.stopPropagation();
            stopAudio();
            stopMetronome();
            onExit();
          }}
          style={iconBtnStyle(false)}
        >
          <IconX size={17} strokeWidth={1.6} />
        </button>

        <div style={{ display: "flex", gap: 10 }}>
          <button
            aria-label="Звук"
                        onClick={(e) => {
              e.stopPropagation();
              setSoundOn((prev) => {
                const next = !prev;
                if (preparing) {
                  // во время подготовки только «взводим» флаг,
                  // само аудио стартует через 3 секунды
                  return next;
                }
                if (next) {
                  if (metronomeEnabled) startMetronome();
                  else startAudio();
                } else {
                  if (metronomeEnabled) stopMetronome();
                  else stopAudio();
                }
                return next;
              });
            }}
            style={iconBtnStyle(soundOn)}
          >
            {soundOn ? <IconVolume2 size={16} strokeWidth={1.6} /> : <IconVolumeX size={16} strokeWidth={1.6} />}
          </button>
          <button
            aria-label="Вибрация"
            onClick={(e) => {
              e.stopPropagation();
              setVibrationOn((v) => !v);
            }}
            style={{ ...iconBtnStyle(vibrationOn), position: "relative" }}
          >
            <IconVibrate size={16} strokeWidth={1.6} />
            {!vibrationOn && (
              <div style={{ position: "absolute", width: 26, height: 1.4, background: "rgba(234,242,248,0.75)", transform: "rotate(45deg)", borderRadius: 1 }} />
            )}
          </button>
                  </div>
      </div>

      {showInfo && (
        <div
          onClick={(e) => e.stopPropagation()}
          style={{
            position: "absolute",
            bottom: 172,
            right: 22,
            width: 250,
            padding: "16px 18px",
            borderRadius: 16,
            border: "1px solid rgba(255,255,255,0.12)",
            background: "rgba(9,23,50,0.92)",
            backdropFilter: "blur(10px)",
            color: "#EAF2F8",
            zIndex: 2,
            animation: "fadeIn 0.35s ease",
          }}
        >
          {technique.contraindication && (
            <div style={{ display: "flex", gap: 8, marginBottom: 12, paddingBottom: 12, borderBottom: "1px solid rgba(255,255,255,0.12)" }}>
              <IconAlertTriangle size={14} strokeWidth={1.7} color="#E8B978" style={{ flexShrink: 0, marginTop: 1 }} />
              <div style={{ fontSize: 12, fontWeight: 300, lineHeight: 1.55, color: "#F3E4CE" }}>{technique.contraindication}</div>
            </div>
          )}
          <div style={{ fontSize: 13, fontWeight: 500, letterSpacing: "0.02em", marginBottom: 8, opacity: 0.95 }}>Когда остановить практику</div>
          <div style={{ fontSize: 12.5, fontWeight: 300, lineHeight: 1.6, opacity: 0.75 }}>
            Прекратите дышать по счёту и вернитесь к обычному дыханию, если почувствуете: головокружение, учащённое или неровное сердцебиение,
            покалывание в пальцах или губах, нехватку воздуха, тревогу или слабость. Дышите комфортно — без усилия и задержки через силу.
          </div>
        </div>
      )}

      <button
        aria-label="Когда остановить практику"
        onClick={(e) => {
          e.stopPropagation();
          setShowInfo((v) => !v);
        }}
        style={{ ...iconBtnStyle(showInfo), position: "absolute", bottom: 122, right: 22, opacity: showChrome ? 1 : 0, transition: "opacity 0.9s ease, background 0.4s ease, color 0.4s ease" }}
      >
        <IconInfo size={16} strokeWidth={1.6} />
      </button>

      {!completed && (
        <svg width={260} height={260} style={{ position: "absolute", transform: "rotate(-90deg)", opacity: showChrome ? 0.4 : 0.14, transition: "opacity 1.2s ease" }}>
          <circle cx={130} cy={130} r={R} fill="none" stroke={RING_TRACK} strokeWidth={1} />
          <circle cx={130} cy={130} r={R} fill="none" stroke={RING_ACCENT} strokeWidth={1} strokeDasharray={C} strokeDashoffset={dash} strokeLinecap="round" style={{ transition: "stroke-dashoffset 0.3s linear" }} />
        </svg>
      )}

      <div style={{ position: "relative", width: 260, height: 260, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div
          style={{
            position: "absolute",
            width: lerp(200, 330, breathNorm),
            height: lerp(200, 330, breathNorm),
            borderRadius: "50%",
            background: `radial-gradient(circle, ${GLOW_MID} 0%, transparent 55%)`,
            opacity: 0.24,
            filter: "blur(46px)",
            transition: "width 0.12s linear, height 0.12s linear",
          }}
        />
        <div
          style={{
            position: "absolute",
            width: lerp(120, 215, breathNorm),
            height: lerp(120, 215, breathNorm),
            borderRadius: "50%",
            background: `radial-gradient(circle, ${GLOW_CORE} 0%, ${GLOW_MID} 40%, transparent 68%)`,
            opacity: 0.4,
            filter: "blur(30px)",
            transition: "width 0.12s linear, height 0.12s linear",
          }}
        />
        <div
          style={{
            position: "absolute",
            width: lerp(30, 54, breathNorm),
            height: lerp(30, 54, breathNorm),
            borderRadius: "50%",
            background: `radial-gradient(circle, ${GLOW_CORE} 0%, ${GLOW_MID} 55%, transparent 85%)`,
            boxShadow: `0 0 ${lerp(30, 54, breathNorm)}px ${lerp(10, 22, breathNorm)}px rgba(95,159,201,0.22)`,
            filter: "blur(12px)",
            transition: "width 0.12s linear, height 0.12s linear, box-shadow 0.12s linear",
          }}
        />
      </div>

      <div style={{ position: "absolute", bottom: "26%", textAlign: "center", color: "#EAF2F8" }}>
        {!completed ? (
          preparing ? (
            <>
              <div
                key="prepare"
                style={{ fontSize: 22, fontWeight: 300, letterSpacing: "0.14em", textTransform: "uppercase", opacity: 0.92, animation: "fadeIn 0.6s ease", minHeight: 28 }}
              >
                Приготовьтесь
              </div>
              <div style={{ marginTop: 10, fontSize: 13, fontWeight: 300, letterSpacing: "0.08em", opacity: 0.5 }}>
                Практика начнётся через 3 секунды
              </div>
            </>
          ) : (
            <>
              <div
                key={guided ? phase.name : "observe"}
                style={{ fontSize: 22, fontWeight: 300, letterSpacing: "0.14em", textTransform: "uppercase", opacity: 0.92, animation: "fadeIn 0.6s ease", minHeight: 28 }}
              >
                {guided ? phase.name : "Наблюдайте"}
              </div>
              <div style={{ marginTop: 10, fontSize: 13, fontWeight: 300, letterSpacing: "0.08em", opacity: 0.5 }}>
                {technique.displayMode === "cycles" ? `Цикл ${currentCycle} из ${technique.totalCycles}` : `${minutesLeft}:${String(secondsLeft).padStart(2, "0")} осталось`}
              </div>
            </>
          )
        ) : (
          <>
            <div style={{ fontSize: 21, fontWeight: 300, letterSpacing: "0.08em", opacity: 0.95, animation: "fadeIn 1.8s ease" }}>Практика завершена</div>
            <div style={{ marginTop: 10, fontSize: 13, fontWeight: 300, opacity: 0.55, letterSpacing: "0.04em" }}>
              {technique.name} · {technique.duration}
            </div>
          </>
        )}
      </div>

      {completed && (
        <div style={{ position: "absolute", bottom: 40, display: "flex", gap: 12 }}>
          <button
            onClick={(e) => {
              e.stopPropagation();
              setElapsed(0);
              setCompleted(false);
              lastTsRef.current = null;
              if (metronomeEnabled && !metroOn) { startMetronome(); setMetroOn(true); }
            }}
            style={{
              padding: "11px 26px",
              borderRadius: 999,
              border: "1px solid rgba(255,255,255,0.22)",
              background: "rgba(255,255,255,0.10)",
              backdropFilter: "blur(6px)",
              color: "#EAF2F8",
              fontSize: 13,
              fontWeight: 400,
              letterSpacing: "0.04em",
              cursor: "pointer",
            }}
          >
            Ещё раз
          </button>
          <button
            onClick={(e) => {
              e.stopPropagation();
              stopAudio();
              stopMetronome();
              onExit();
            }}
            style={{ padding: "11px 22px", borderRadius: 999, border: "1px solid transparent", background: "transparent", color: "rgba(234,242,248,0.6)", fontSize: 13, fontWeight: 300, letterSpacing: "0.02em", cursor: "pointer" }}
          >
            Другая практика
          </button>
        </div>
      )}

      <style>{`
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
      `}</style>
    </div>
  );
}

// =====================================================================
// Корневой компонент
// =====================================================================
function BreathingApp() {
  const [techniqueId, setTechniqueId] = useState(null);
  const [resolvedTechnique, setResolvedTechnique] = useState(null);
  const [mainView, setMainView] = useState("practices");
  const technique = TECHNIQUES.find((t) => t.id === techniqueId);

  const exitToPractices = () => {
    setTechniqueId(null);
    setResolvedTechnique(null);
  };

  if (technique) {
    if (technique.type === "checkin") {
      return <BreathCheckIn onExit={exitToPractices} />;
    }
    if (!resolvedTechnique) {
      return <PracticeSetup technique={technique} onBack={exitToPractices} onStart={setResolvedTechnique} />;
    }
    return <BreathingSession technique={resolvedTechnique} onExit={exitToPractices} />;
  }

  return (
    <div style={{ width: "100%", height: "100vh", minHeight: 640, display: "flex", flexDirection: "column", background: BG }}>
      <div style={{ flex: 1, minHeight: 0, position: "relative" }}>
        {mainView === "practices" && <TechniqueSelect onSelect={setTechniqueId} />}
        {mainView === "progress" && <ProgressTab />}
        {mainView === "settings" && <SettingsTab />}
      </div>
      <TabBar active={mainView} onChange={setMainView} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<BreathingApp />);
</script>

  __s.text = __out;
  document.body.appendChild(__s);
